schema_version = "1.1"

[task]
name = "dataorigin/REPLACE-task-id"
description = "One-line summary of what the agent must do."
authors = [{ name = "claude-opus-5-5" }]
keywords = ["java", "bugfix"]

[metadata]
category = "bugfix"            # bugfix | feature_request | refactor
language = "java"
repository_url = "https://github.com/OWNER/REPO"
base_commit_hash = "REPLACE_WITH_FULL_SHA"
difficulty = "hard"
task_author_model = "claude-opus-5-5"

[verifier]
timeout_sec = 1800.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
gpus = 0
# Codex runs inside the container and must reach OpenAI, so keep public network.
network_mode = "public"

[verifier.env]

[environment.env]

[solution.env]
